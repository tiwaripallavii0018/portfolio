spring.application.name=portfolio-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/portfolio_db}
spring.datasource.username=${DB_USERNAME:portfolio_user}
spring.datasource.password=${DB_PASSWORD:portfolio_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

management.endpoints.web.exposure.include=health,info